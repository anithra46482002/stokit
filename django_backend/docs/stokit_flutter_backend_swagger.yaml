      description: |
        Unit-test-verified (Task 1A; DB-backed flow BLOCKED). Public, POST only. otp is 6 digits (string or integer);
        the new password must be a STRING of at least 10 characters (lists/numbers/null are rejected). An unknown
        account, missing/expired/consumed code and exhausted attempts all return the same 400 body (no enumeration).
